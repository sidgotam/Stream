<!DOCTYPE html><html><head><meta charset="utf-8"><title>Match ID Maker</title>
<style>body{background:#0a0e13;color:#e9eff5;font:14px system-ui;padding:20px;max-width:700px;margin:auto}
input,select{width:100%;padding:9px;margin:5px 0 12px;background:#121a22;color:#fff;border:1px solid #22303c;border-radius:8px}
button{background:#00c26e;color:#04120a;font-weight:700;padding:10px 20px;border:0;border-radius:8px;cursor:pointer}
pre{background:#121a22;border:1px solid #22303c;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
label{color:#8b9bab;font-size:12px}</style></head><body>
<h2>Match ID + Object Maker</h2>
<label>Team A (short)</label><input id="a" value="IND">
<label>Team B (short)</label><input id="b" value="NZ">
<label>Match number + format</label><input id="n" value="3rd T20I">
<label>Date (YYYY-MM-DD)</label><input id="d" value="2026-10-26">
<label>Time IST 24hr (HH:MM)</label><input id="t" value="12:30">
<label>Venue</label><input id="v" value="Bay Oval, Mount Maunganui">
<label>Series</label><input id="s" value="India tour of New Zealand 2026">
<button onclick="go()">Generate</button>
<h3>ID</h3><pre id="oid"></pre>
<h3>matches.js</h3><pre id="om"></pre>
<h3>servers.js</h3><pre id="os"></pre>
<h3>MATCH_ID line</h3><pre id="op"></pre>
<h3>Folder</h3><pre id="of"></pre>
<script>
const g=id=>document.getElementById(id).value.trim();
const slug=x=>x.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function go(){
  const id=slug(g('a')+'-vs-'+g('b')+'-'+g('n'));
  const title=g('a')+' vs '+g('b')+', '+g('n');
  const date=g('d')+'T'+g('t')+':00+05:30';
  oid.textContent=id;
  om.textContent='  { id:"'+id+'", title:"'+title+'",\n    date:"'+date+'", venue:"'+g('v')+'",\n    series:"'+g('s')+'" }';
  os.textContent='  "'+id+'": [\n    { name:"Server 1 (HD)", src:"" },\n    { name:"Server 2", src:"" },\n    { name:"Server 3 (Backup)", src:"" }\n  ]';
  op.textContent='<script>window.MATCH_ID = "'+id+'";<\/script>';
  of.textContent='match/'+id+'/index.html';
}
go();
</script></body></html>
